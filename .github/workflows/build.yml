###############################################################################
# Build, sign, attest and push. Runs only on main.
# The output is an immutable digest plus a cosign signature and an SBOM
# attestation - which is exactly what the Kyverno admission policy verifies
# before the image is allowed to run.
###############################################################################
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      service:
        description: Build a single service
        required: false

permissions:
  contents: read
  id-token: write        # OIDC to AWS and to Sigstore
  packages: read
  attestations: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 111122223333.dkr.ecr.ap-south-1.amazonaws.com
  ECR_NAMESPACE: aiplat

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.collect.outputs.digests }}
    strategy:
      fail-fast: false
      matrix:
        service: [ai-gateway, rag-service, agent-service, eval-service]
    steps:
      - uses: actions/checkout@v4

      # No AWS account is wired to this repo yet (AWS_PLAN_ROLE_ARN unset) -
      # every step below needs real AWS/ECR access, so skip cleanly rather
      # than fail noisily on every push. Remove this probe once a real
      # account exists; every later step already becomes a no-op gate.
      - name: Check AWS credentials are configured
        id: probe
        run: |
          if [ -z "${{ secrets.AWS_PLAN_ROLE_ARN }}" ]; then
            echo "::notice::AWS_PLAN_ROLE_ARN is not set - skipping build/push/sign for ${{ matrix.service }}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.probe.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - if: steps.probe.outputs.configured == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.probe.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Derive version
        if: steps.probe.outputs.configured == 'true'
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-main.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.probe.outputs.configured == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Scanning the pushed image, not the local one: this is the artifact that
      # will actually run, digest and all.
      - name: Scan pushed image
        if: steps.probe.outputs.configured == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM
        if: steps.probe.outputs.configured == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.json

      - if: steps.probe.outputs.configured == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign (keyless)
        if: steps.probe.outputs.configured == 'true'
        run: |
          cosign sign --yes \
            "${ECR_REGISTRY}/${ECR_NAMESPACE}/${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Attest SBOM
        if: steps.probe.outputs.configured == 'true'
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom-${{ matrix.service }}.json \
            "${ECR_REGISTRY}/${ECR_NAMESPACE}/${{ matrix.service }}@${{ steps.push.outputs.digest }}"

      - name: Record digest
        if: steps.probe.outputs.configured == 'true'
        id: collect
        run: |
          echo "digests=${{ matrix.service }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - if: steps.probe.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json
          retention-days: 90

  update-dev-manifests:
    # GitOps write-back: CI never talks to the cluster. It updates the digest in
    # the values file and Argo CD does the rest. The audit trail for "what is
    # running in dev" is the git history of this file.
    needs: build
    runs-on: ubuntu-latest
    # Shared group with release.yml's promote job: both commit straight onto
    # main, and a second push racing in before the first lands gets rejected
    # non-fast-forward with no retry logic here to recover from it. One group
    # name across both workflows serializes every GitOps write-back commit.
    concurrency:
      group: gitops-manifest-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Check AWS credentials are configured
        id: probe
        run: |
          if [ -z "${{ secrets.AWS_PLAN_ROLE_ARN }}" ]; then
            echo "::notice::AWS_PLAN_ROLE_ARN is not set - nothing to pin, no GitOps commit to make"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.probe.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pin digests in the dev overlay
        if: steps.probe.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p deploy/helm/values/overlays/dev
          for service in ai-gateway rag-service agent-service eval-service; do
            digest=$(aws ecr describe-images \
              --repository-name "${ECR_NAMESPACE}/${service}" \
              --image-ids imageTag="sha-${GITHUB_SHA}" \
              --query 'imageDetails[0].imageDigest' --output text)
            cat > "deploy/helm/values/overlays/dev/${service}.yaml" <<EOF
          # Written by .github/workflows/build.yml - do not edit by hand.
          image:
            tag: sha-${GITHUB_SHA}
            digest: ${digest}
          env:
            ENVIRONMENT: dev
          EOF
          done

      - name: Commit
        if: steps.probe.outputs.configured == 'true'
        run: |
          git config user.name "platform-ci"
          git config user.email "platform-ci@users.noreply.github.com"
          git add deploy/helm/values/overlays/dev
          git diff --staged --quiet || git commit -m "chore(dev): pin images to ${GITHUB_SHA::7} [skip ci]"
          git push
