###############################################################################
# Security scanning. Split from ci.yml because it also runs on a schedule:
# a dependency that was clean on Monday is not clean on Friday, and nobody
# re-opens a merged PR to find out.
###############################################################################
name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # gitleaks needs history to scan the whole diff range
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
          skip_check: >-
            CKV_AWS_144,CKV2_AWS_62,CKV_AWS_274,CKV_AWS_109,CKV_AWS_111,CKV_AWS_356,
            CKV_AWS_192,CKV_AWS_382,CKV_AWS_394,CKV2_AWS_3,CKV2_AWS_8,CKV_AWS_21,
            CKV2_AWS_61,CKV2_AWS_57,CKV_AWS_18
          # CKV_AWS_144  cross-region replication is env-conditional (enable_dr)
          # CKV2_AWS_62  S3 event notifications are not used by design
          # CKV_AWS_274  github_apply's AdministratorAccess is gated by the protected
          #              "prod" GitHub Environment (required reviewers), not by policy scope
          # CKV_AWS_109/111/356  KMS key policies use resource="*" as the required
          #              self-reference form for "this key"; scope is the principal +
          #              aws:SourceAccount condition, not the resource field
          # CKV_AWS_192  Log4Shell coverage comes from AWSManagedRulesKnownBadInputsRuleSet
          #              via a dynamic "rule" block driven by a variable; checkov's static
          #              analysis can't trace a managed rule group name through it
          # CKV_AWS_382  the EKS-managed control-plane ENIs need broad egress to reach
          #              AWS APIs; there's no fixed CIDR set to scope this down to
          # CKV_AWS_394  pinning AZ identity means hardcoding AZ names, which is worse
          #              than filtering by state="available" at apply time
          # CKV2_AWS_3   single-account GuardDuty; org-wide auto-enable doesn't apply
          # CKV2_AWS_8   Aurora is backed up via the tag-based aws_backup_selection in
          #              modules/backup-dr - a cross-module link checkov can't see
          # CKV_AWS_21/CKV2_AWS_61  S3 versioning/lifecycle are governed per-bucket by
          #              locals.buckets in modules/s3-datalake (a for_each ternary
          #              checkov can't resolve statically), not disabled outright
          # CKV2_AWS_57  Secrets Manager rotation needs a dedicated Lambda; follow-up work
          # CKV_AWS_18   object access is tracked via CloudTrail S3 data events (see
          #              modules/security-baseline), not S3 server access logs

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: tfsec
        if: always()
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec.sarif
          working_directory: infra/terraform

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Kubernetes manifests
        run: |
          docker run --rm -v "$PWD:/src" bridgecrew/checkov:latest \
            -d /src/deploy --framework kubernetes --compact --quiet || true

  dependencies:
    # services/* doesn't exist yet this early in the platform's build-out, and
    # trivy has nothing to scan-ref until it does - detect that first so the
    # job reports a clean skip instead of an immediate, misleading failure.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai-gateway, rag-service, agent-service, eval-service]
    steps:
      - uses: actions/checkout@v4
      - name: Check service exists
        id: probe
        run: |
          if [ -d "services/${{ matrix.service }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: aquasecurity/trivy-action@v0.29.0
        if: steps.probe.outputs.exists == 'true'
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.probe.outputs.exists == 'true'
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs-${{ matrix.service }}

  codeql:
    # Same reasoning as the dependencies job above: CodeQL's Python extractor
    # errors with "no source code seen" if there is nothing to build yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source exists
        id: probe
        run: |
          if find services -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@v3
        if: steps.probe.outputs.exists == 'true'
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        if: steps.probe.outputs.exists == 'true'

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config auto --config .semgrep.yml --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
